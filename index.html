<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080c13" />
  <meta name="description" content="資本人生 Capital Life - Web Frontend" />
  <title>資本人生 Capital Life</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/trading.css" />
  <link rel="stylesheet" href="./css/life.css" />
  <link rel="stylesheet" href="./css/family.css" />
  <link rel="stylesheet" href="./css/company.css" />
  <link rel="stylesheet" href="./css/power.css" />
  <link rel="stylesheet" href="./css/content.css" />
  <link rel="stylesheet" href="./css/settlement.css" />
  <link rel="stylesheet" href="./css/save.css" />
  <link rel="stylesheet" href="./css/legacy.css" />
  <link rel="stylesheet" href="./css/polish.css" />
  <link rel="stylesheet" href="./css/launch.css" />
  <link rel="stylesheet" href="./css/launch-mode.css" />
  <script src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">CL</div>
        <div><div class="brand-title">資本人生</div><div class="brand-subtitle">Capital Life</div></div>
      </div>
      <div class="topbar-center" aria-label="遊戲摘要">
        <div class="summary-chip"><span>Day</span><strong id="summary-date">—</strong></div>
        <div class="summary-chip"><span>Cash</span><strong id="summary-cash">—</strong></div>
        <div class="summary-chip"><span>Net Worth</span><strong id="summary-networth">—</strong></div>
      </div>
      <div class="connection-block"><span id="connection-dot" class="connection-dot is-offline"></span><span id="connection-label">後端未連線</span></div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="主選單">
        <div class="sidebar-section">Market</div>
        <button class="nav-button is-active" data-view="trading"><span class="nav-icon">▦</span><span class="nav-label">股票交易</span></button>
        <button class="nav-button" data-view="news"><span class="nav-icon">◫</span><span class="nav-label">市場新聞</span></button>

        <div class="sidebar-section">Life</div>
        <button class="nav-button" data-view="life"><span class="nav-icon">◎</span><span class="nav-label">人生中心</span></button>
        <button class="nav-button" data-view="company"><span class="nav-icon">▣</span><span class="nav-label">公司經營</span></button>
        <button class="nav-button" data-view="politics"><span class="nav-icon">⚖</span><span class="nav-label">政治法律</span></button>
        <button class="nav-button" data-view="progress"><span class="nav-icon">◇</span><span class="nav-label">生涯進度</span></button>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-section">System</div>
        <button class="nav-button" data-view="save"><span class="nav-icon">◈</span><span class="nav-label">存檔管理</span></button>
        <button class="nav-button" data-view="settings"><span class="nav-icon">⚙</span><span class="nav-label">設定</span></button>
      </aside>

      <main class="main-stage">
        <section id="backend-banner" class="backend-banner is-visible" role="status"><strong>前端已啟動。</strong><span>遊戲核心由 Private FastAPI Backend 執行；若後端未連線，所有會改變遊戲狀態的操作都會鎖定。</span></section>
        <div id="view-root" class="view-root" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/market-events.js"></script>
  <script type="module" src="./js/family-events.js"></script>
  <script type="module" src="./js/company-events.js"></script>
  <script type="module" src="./js/power-events.js"></script>
  <script type="module" src="./js/content-events.js"></script>
  <script type="module" src="./js/settlement-events.js"></script>
  <script type="module" src="./js/save-events.js"></script>
</body>
</html>
