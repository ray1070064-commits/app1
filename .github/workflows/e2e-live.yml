name: Live production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/e2e-live.trigger'

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      E2E_API_URL: https://capital-life-api.onrender.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run live browser flow
        run: node tools/e2e_live.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-failure
          path: artifacts/e2e-failure.png
          if-no-files-found: ignore
