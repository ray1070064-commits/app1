name: Frontend static CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject Python source in public frontend
        shell: bash
        run: |
          found="$(find . -type f -name '*.py' -not -path './.git/*' -print)"
          if [ -n "$found" ]; then
            echo 'Public frontend must not contain Python source:'
            echo "$found"
            exit 1
          fi
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -e
          for file in js/*.js; do
            echo "checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Guard common secret file patterns
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) -not -path './.git/*' | grep .; then
            echo 'Secret-like file found in public repository.'
            exit 1
          fi
